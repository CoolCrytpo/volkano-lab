  </defs>
  <rect width="800" height="450" fill="url(#glow3)"/>
  <!-- French flag subtle colors -->
  <rect x="0" y="0" width="267" height="4" fill="#002395" opacity="0.5"/>
  <rect x="267" y="0" width="266" height="4" fill="white" opacity="0.5"/>
  <rect x="533" y="0" width="267" height="4" fill="#ED2939" opacity="0.5"/>
