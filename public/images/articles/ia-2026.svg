<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#1A1A1A"/>
  <rect width="800" height="450" fill="url(#grid)" opacity="0.15"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 40V0H40" stroke="white" stroke-width="0.5" fill="none"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34A2ED" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1A1A1A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="400" cy="225" r="200" fill="url(#glow)"/>
  <circle cx="400" cy="225" r="80" fill="none" stroke="#34A2ED" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6"/>
  <circle cx="400" cy="225" r="50" fill="none" stroke="#F39C12" stroke-width="2" opacity="0.8"/>
  <circle cx="400" cy="225" r="20" fill="#34A2ED" opacity="0.9"/>
  <!-- Neural network nodes -->
  <circle cx="280" cy="160" r="8" fill="#34A2ED" opacity="0.7"/>
  <circle cx="520" cy="160" r="8" fill="#34A2ED" opacity="0.7"/>
  <circle cx="280" cy="290" r="8" fill="#34A2ED" opacity="0.7"/>
  <circle cx="520" cy="290" r="8" fill="#34A2ED" opacity="0.7"/>
  <line x1="280" y1="160" x2="400" y2="225" stroke="#34A2ED" stroke-width="1" opacity="0.4"/>
  <line x1="520" y1="160" x2="400" y2="225" stroke="#34A2ED" stroke-width="1" opacity="0.4"/>
  <line x1="280" y1="290" x2="400" y2="225" stroke="#34A2ED" stroke-width="1" opacity="0.4"/>
  <line x1="520" y1="290" x2="400" y2="225" stroke="#34A2ED" stroke-width="1" opacity="0.4"/>
  <!-- Tag -->
  <rect x="30" y="390" width="120" height="32" rx="16" fill="#F39C12" opacity="0.9"/>
  <text x="90" y="411" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle" letter-spacing="1">IA · 2026</text>
</svg>
