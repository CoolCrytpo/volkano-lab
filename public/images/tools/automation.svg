<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#1A1A1A"/>
  <defs>
    <pattern id="grid6" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 40V0H40" stroke="white" stroke-width="0.3" fill="none"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid6)" opacity="0.08"/>
  <!-- Process flow diagram -->
  <!-- Node 1 -->
  <rect x="80" y="185" width="120" height="80" rx="12" fill="#F39C12" opacity="0.15" stroke="#F39C12" stroke-width="1.5"/>
  <text x="140" y="220" font-family="system-ui" font-size="11" fill="#F39C12" text-anchor="middle" font-weight="600">Processus</text>
  <text x="140" y="238" font-family="system-ui" font-size="10" fill="#F39C12" text-anchor="middle" opacity="0.7">Manuel</text>
  <!-- Arrow -->
  <line x1="200" y1="225" x2="290" y2="225" stroke="#F39C12" stroke-width="2" stroke-dasharray="6 3" opacity="0.6"/>
  <polygon points="290,220 300,225 290,230" fill="#F39C12" opacity="0.8"/>
  <!-- Node 2 - Automation -->
  <rect x="300" y="175" width="200" height="100" rx="16" fill="#F39C12" opacity="0.9"/>
  <text x="400" y="220" font-family="system-ui" font-size="14" fill="white" text-anchor="middle" font-weight="700">⚡ Auto</text>
  <text x="400" y="242" font-family="system-ui" font-size="10" fill="white" text-anchor="middle" opacity="0.9">Make / Zapier / N8n</text>
  <!-- Arrow -->
  <line x1="500" y1="225" x2="590" y2="225" stroke="#34A2ED" stroke-width="2" stroke-dasharray="6 3" opacity="0.6"/>
  <polygon points="590,220 600,225 590,230" fill="#34A2ED" opacity="0.8"/>
  <!-- Node 3 -->
  <rect x="600" y="185" width="120" height="80" rx="12" fill="#34A2ED" opacity="0.15" stroke="#34A2ED" stroke-width="1.5"/>
  <text x="660" y="220" font-family="system-ui" font-size="11" fill="#34A2ED" text-anchor="middle" font-weight="600">Résultat</text>
  <text x="660" y="238" font-family="system-ui" font-size="10" fill="#34A2ED" text-anchor="middle" opacity="0.7">Automatique</text>
  <!-- Checklist label -->
  <text x="400" y="340" font-family="system-ui" font-size="14" fill="white" text-anchor="middle" opacity="0.5">Checklist · Identifier · Prioriser · Automatiser</text>
</svg>
